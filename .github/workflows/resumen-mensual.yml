# Envía el "Resumen mensual" a los ADMINISTRADORES y GERENTES de cada empresa,
# el primer día de cada mes (resume el mes que acaba de cerrar).
#
# Por qué GitHub Actions y no un cron de Vercel: el plan Hobby de Vercel solo
# permite crons diarios y un máximo de 2 (ya usados por notificaciones y
# respaldo). Este workflow llama al endpoint del CRM con el CRON_SECRET; toda la
# lógica (recorrer tenants → armar el correo → enviar con Resend) vive en el
# endpoint /api/cron/resumen-mensual.
#
# Horario: día 1 a las 12:00 UTC = 7:00 a.m. en Bogotá (UTC-5). Si el repo queda
# 60 días sin actividad, GitHub desactiva el schedule (se reactiva con un push o
# desde la pestaña Actions).
#
# Configuración (una sola vez, en GitHub → Settings → Secrets and variables →
# Actions): Secret CRON_SECRET (el mismo de Vercel) y, opcional, Variable
# CRM_URL con la URL base de producción. (Ya configurados para el resumen semanal.)

name: Resumen mensual CRM

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Correo de PRUEBA: si se indica, envía SOLO a este correo (no el envío masivo)."
        required: false
        default: ""
      test_tenant:
        description: "Slug del tenant para la prueba."
        required: false
        default: "demo-evoluteca"

jobs:
  resumen-mensual:
    runs-on: ubuntu-latest
    steps:
      # OJO: el repo es PÚBLICO y sus registros de Actions también. Ningún correo
      # puede aparecer en ellos: el de prueba se lee del evento (no de env, que
      # se imprime) y se enmascara; la respuesta se resume sin direcciones.
      - name: Llamar al endpoint del resumen mensual
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRM_URL: ${{ vars.CRM_URL || 'https://evoluteca-crm-six.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secret CRON_SECRET en el repositorio." >&2
            exit 1
          fi
          TEST_EMAIL=$(jq -r '.inputs.test_email // ""' "$GITHUB_EVENT_PATH")
          TEST_TENANT=$(jq -r '.inputs.test_tenant // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$TEST_EMAIL" ]; then
            echo "::add-mask::$TEST_EMAIL"
            echo "Modo PRUEBA → solo al correo indicado (tenant: ${TEST_TENANT:-demo-evoluteca})"
            codigo=$(curl -sS -G -o respuesta.json -w "%{http_code}"               -H "Authorization: Bearer $CRON_SECRET"               --data-urlencode "to=$TEST_EMAIL"               --data-urlencode "tenant=${TEST_TENANT:-demo-evoluteca}"               "$CRM_URL/api/cron/resumen-mensual")
          else
            codigo=$(curl -sS -o respuesta.json -w "%{http_code}"               -H "Authorization: Bearer $CRON_SECRET"               "$CRM_URL/api/cron/resumen-mensual")
          fi
          echo "HTTP $codigo"
          # Solo conteos: "errores" trae correos de clientes, así que se cuenta, no se imprime.
          jq -c '{dryRun, tenants, enviados, generados, tenantsOmitidos, errores: ((.errores // []) | length), test, enviado, vacio, error}' respuesta.json 2>/dev/null || echo "(respuesta no JSON)"
          # 2xx = OK; cualquier otro código marca el run como fallido.
          [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]

      # Copia mensual del resumen del DEMO a quien lo revisa: el admin del demo
      # (admin@demo-evoluteca.co) no es un buzón que alguien lea. El destino es el
      # SECRET RESUMEN_DEMO_EMAIL (enmascarado en los registros). Solo en la
      # corrida programada; si el secret no existe, no hace nada.
      - name: Copia del resumen del demo
        if: github.event_name == 'schedule'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRM_URL: ${{ vars.CRM_URL || 'https://evoluteca-crm-six.vercel.app' }}
          COPIA_EMAIL: ${{ secrets.RESUMEN_DEMO_EMAIL }}
        run: |
          if [ -z "$COPIA_EMAIL" ]; then
            echo "Sin RESUMEN_DEMO_EMAIL: no se envía copia."
            exit 0
          fi
          codigo=$(curl -sS -G -o copia.json -w "%{http_code}"             -H "Authorization: Bearer $CRON_SECRET"             --data-urlencode "to=$COPIA_EMAIL"             --data-urlencode "tenant=demo-evoluteca"             "$CRM_URL/api/cron/resumen-mensual")
          echo "HTTP $codigo"
          jq -c '{test, enviado, vacio, error}' copia.json 2>/dev/null || echo "(respuesta no JSON)"
          [ "$codigo" -ge 200 ] && [ "$codigo" -lt 300 ]
